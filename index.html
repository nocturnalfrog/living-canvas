<!DOCTYPE html>
<html lang="en">
    <head>
        <title>CanvasLife</title>
        <meta charset="utf-8">
        <meta name="description" content="HTML5 canvas implementation of Conway's Game of Life."/>
        <meta name="author" content="Tjerk Ameel"/>
        <meta name="robots" content="index, follow"/>
        <link rel="stylesheet" href="/css/universe.css" media="all"/>
        <script src="//ajax.googleapis.com/ajax/libs/jquery/1.5.1/jquery.js"></script>
        <script src="/js/life.js"></script>
        <script>
            $(document).ready(function () {
                const $showGrid = $("#showGrid");
                const $startStop = $("#startstop");
                const $next = $("#next");
                const $reset = $("#reset");
                const $lifetime = $("#lifetime");
                const $lifetimeLabel = $("#lifetime_label");
                const $celSize = $("#celsize");
                const $celSizeLabel = $("#celsize_label");

                function updateRangeLabel($label, value, suffix) {
                    $label.html(value + suffix);
                }

                // EventListeners
                $showGrid.click(function () {
                    myLife.setGridEnabled(this.checked);
                });

                $startStop.click(function () {
                    myLife.toggleEvolution();
                });

                $next.click(function () {
                    myLife.evolve();
                });

                $reset.click(function () {
                    myLife.resetUniverse();
                });

                $lifetime.change(function () {
                    const newCycleTime = $lifetime.val();
                    updateRangeLabel($lifetimeLabel, newCycleTime, 'ms');
                    myLife.setCycleTime(newCycleTime);
                });

                $celSize.change(function () {
                    const newCelSize = $celSize.val();
                    updateRangeLabel($celSizeLabel, newCelSize, 'px');
                    myLife.setCelSize(newCelSize);
                });

                $celSize.mousemove(function () {
                    updateRangeLabel($celSizeLabel, $celSize.val(), 'px');
                });

                $lifetime.mousemove(function () {
                    updateRangeLabel($lifetimeLabel, $lifetime.val(), 'ms');
                });

                $(document).keydown(function (event) {
                    // Space toggles evolution, unless a form control has focus (space is its own activator there).
                    if (event.which !== 32 || $(event.target).is('input, button, select, textarea')) {
                        return;
                    }
                    event.preventDefault();
                    myLife.toggleEvolution();
                });


                // Initialization
                const celSize = 5;
                $celSize.val(celSize);
                updateRangeLabel($celSizeLabel, celSize, 'px');

                const cycleTime = 30;
                $lifetime.val(cycleTime);
                updateRangeLabel($lifetimeLabel, cycleTime, 'ms');


                const myLife = life.createUniverse('#universe', {
                    hasGrid: false,
                    debugMode: true,
                    celSize: celSize,
                    cycleTime: cycleTime,
                    startStopButtonSelector: '#startstop',
                    fpsSelector: '#fps'
                });
                myLife.startEvolving();
            });
        </script>
    </head>
    <body>
        <canvas id="universe">
            <strong>Your browser does not support canvas. You should probably upgrade and come back.</strong>
        </canvas>
        <a class="github-corner" href="https://github.com/nocturnalfrog/living-canvas" title="Fork me on GitHub"><img src="images/github-corner.svg" width="80" height="80" alt="Fork me on GitHub"></a>
        <footer>
            <div class="inner">
                <div class="settings-toggle">
                    <img class="cogwheel" src="images/cog.svg" width="36" height="36" alt="settings"/>
                    <h1>Living Canvas</h1>
                </div>
                <div class="controls">
                    <div class="buttons">
                        <button class="button" id="startstop">start/stop</button>
                        <button class="button" id="next">next</button>
                        <button class="button" id="reset">reset</button>
                    </div>
                    <div class="range-slider">
                        <label>Generation lifetime: </label><span id="lifetime_label">999ms</span><br>
                        <input type="range" name="lifetime" id="lifetime" step="10" min="15" max="1000"><br>
                    </div>

                    <div class="range-slider">
                        <label>Cel Size: </label><span id="celsize_label">999px</span><br>
                        <input type="range" name="size" id="celsize" min="1" max="60"><br>
                    </div>
                    <!--<div class="advanced">-->
                    <!--<label><input type="checkbox" id="showGrid" name="showGrid" value="">Show Grid</label><br>-->
                    <!--</div>-->
                </div>
            </div>
        </footer>
        <div id="fps">– fps</div>
    </body>
</html>
